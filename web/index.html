<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RC Car Console</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f1e8;
        --panel: #fffdf8;
        --ink: #1f2a2e;
        --accent: #0d6b5c;
        --danger: #a63d40;
        --border: #d9d1bf;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        color: var(--ink);
        background: radial-gradient(circle at top, #fffaf0, var(--bg));
      }
      main {
        max-width: 900px;
        margin: 0 auto;
        padding: 24px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 16px;
        margin-bottom: 16px;
      }
      .row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 220px;
      }
      input, button {
        font: inherit;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
      }
      button {
        cursor: pointer;
        background: var(--accent);
        color: white;
        border: none;
      }
      button.stop { background: var(--danger); }
      pre {
        white-space: pre-wrap;
        background: #f6f6f6;
        border-radius: 12px;
        padding: 12px;
        min-height: 180px;
        border: 1px solid var(--border);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="panel">
        <h1>RC Car Console</h1>
        <p>Use this page to verify control and camera paths.</p>
      </div>

      <div class="panel">
        <div class="row">
          <label>
            Broker URL
            <input id="brokerUrl" value="" />
          </label>
          <label>
            Device ID (optional)
            <input id="deviceId" placeholder="auto" />
          </label>
        </div>
        <div class="row" style="margin-top: 12px">
          <button id="connectBtn">Connect</button>
          <button id="disconnectBtn">Disconnect</button>
        </div>
      </div>

      <div class="panel">
        <div class="row">
          <label>
            Throttle
            <input id="throttle" type="range" min="-100" max="100" value="0" />
          </label>
          <label>
            Steering
            <input id="steering" type="range" min="-45" max="45" value="0" />
          </label>
        </div>
        <div class="row" style="margin-top: 12px">
          <button id="sendBtn">Send Control</button>
          <button id="stopBtn" class="stop">Stop</button>
        </div>
      </div>

      <div class="panel">
        <pre id="log"></pre>
      </div>

      <div class="panel">
        <div class="row">
          <label style="flex: 1 1 100%">
            Video URL
            <input id="videoUrl" placeholder="http://esp32-ip/stream" />
          </label>
        </div>
        <div class="row" style="margin-top: 12px">
          <button id="loadVideoBtn">Load Video</button>
          <button id="clearVideoBtn">Clear Video</button>
        </div>
        <div style="margin-top: 16px">
          <img id="videoFrame" alt="RC car video" style="width: 100%; min-height: 240px; background: #ece8dd; border-radius: 12px; border: 1px solid var(--border); object-fit: contain; transform: scaleX(-1);" />
        </div>
      </div>

      <div class="panel">
        <div class="row">
          <button id="startAudioBtn">Start Audio</button>
          <button id="stopAudioBtn" class="stop">Stop Audio</button>
        </div>
        <div style="margin-top: 12px">
          <strong id="audioStatus">audio idle</strong>
        </div>
      </div>
    </main>

    <script>
      const brokerInput = document.getElementById("brokerUrl");
      const deviceIdInput = document.getElementById("deviceId");
      const throttleInput = document.getElementById("throttle");
      const steeringInput = document.getElementById("steering");
      const logEl = document.getElementById("log");
      const videoUrlInput = document.getElementById("videoUrl");
      const videoFrame = document.getElementById("videoFrame");
      const audioStatusEl = document.getElementById("audioStatus");

      const defaultProtocol = location.protocol === "https:" ? "wss" : "ws";
      const defaultHost = location.host || "localhost:8080";
      brokerInput.value = `${defaultProtocol}://${defaultHost}/client`;

      let ws = null;
      let clientPingTimer = null;
      const audioState = {
        ctx: null,
        sampleRate: 16000,
        enabled: false,
        nextPlayAt: 0,
        maxLeadSeconds: 0.24,
        targetLeadSeconds: 0.05,
        lastSeqByDevice: new Map()
      };

      function log(line) {
        logEl.textContent += `${new Date().toISOString()} ${line}\n`;
        logEl.scrollTop = logEl.scrollHeight;
      }

      function setAudioStatus(text) {
        audioStatusEl.textContent = text;
      }

      function loadVideo(url) {
        if (!url) {
          log("video url is empty");
          return;
        }
        videoFrame.src = url;
        log(`video loading: ${url}`);
      }

      function send(payload) {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
          return;
        }
        ws.send(JSON.stringify(payload));
      }

      function startClientPing() {
        stopClientPing();
        clientPingTimer = setInterval(() => {
          send({ type: "ping" });
        }, 10000);
      }

      function stopClientPing() {
        if (clientPingTimer) {
          clearInterval(clientPingTimer);
          clientPingTimer = null;
        }
      }

      async function ensureAudioContext(sampleRate = audioState.sampleRate) {
        if (!audioState.ctx || audioState.sampleRate !== sampleRate) {
          if (audioState.ctx) {
            await audioState.ctx.close();
          }
          const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
          audioState.sampleRate = sampleRate;
          audioState.ctx = new AudioContextCtor({ sampleRate });
        }
        if (audioState.ctx.state !== "running") {
          await audioState.ctx.resume();
        }
      }

      function decodeMulawByte(value) {
        const mu = (~value) & 0xff;
        const sign = mu & 0x80;
        const exponent = (mu >> 4) & 0x07;
        const mantissa = mu & 0x0f;
        let sample = ((mantissa << 3) + 0x84) << exponent;
        sample = sign ? 0x84 - sample : sample - 0x84;
        return sample / 32768;
      }

      const IMA_INDEX_TABLE = [
        -1, -1, -1, -1, 2, 4, 6, 8,
        -1, -1, -1, -1, 2, 4, 6, 8
      ];

      const IMA_STEP_TABLE = [
        7, 8, 9, 10, 11, 12, 13, 14, 16, 17,
        19, 21, 23, 25, 28, 31, 34, 37, 41, 45,
        50, 55, 60, 66, 73, 80, 88, 97, 107, 118,
        130, 143, 157, 173, 190, 209, 230, 253, 279, 307,
        337, 371, 408, 449, 494, 544, 598, 658, 724, 796,
        876, 963, 1060, 1166, 1282, 1411, 1552, 1707, 1878, 2066,
        2272, 2499, 2749, 3024, 3327, 3660, 4026, 4428, 4871, 5358,
        5894, 6484, 7132, 7845, 8630, 9493, 10442, 11487, 12635, 13899,
        15289, 16818, 18500, 20350, 22385, 24623, 27086, 29794, 32767
      ];

      function decodeBase64ToBytes(encoded) {
        const raw = atob(encoded);
        const bytes = new Uint8Array(raw.length);
        for (let i = 0; i < raw.length; i += 1) {
          bytes[i] = raw.charCodeAt(i);
        }
        return bytes;
      }

      function decodeAdpcmChunk(bytes, sampleCount) {
        if (!bytes.length || bytes.length < 4 || sampleCount <= 0) {
          return new Float32Array(0);
        }

        let predictor = (bytes[1] << 8) | bytes[0];
        if (predictor & 0x8000) {
          predictor -= 0x10000;
        }
        let stepIndex = Math.max(0, Math.min(88, bytes[2] || 0));
        const output = new Float32Array(sampleCount);
        output[0] = predictor / 32768;

        let outIndex = 1;
        for (let i = 4; i < bytes.length && outIndex < sampleCount; i += 1) {
          const packed = bytes[i];
          for (const nibble of [packed & 0x0f, (packed >> 4) & 0x0f]) {
            let step = IMA_STEP_TABLE[stepIndex];
            let diff = step >> 3;
            if (nibble & 1) diff += step >> 2;
            if (nibble & 2) diff += step >> 1;
            if (nibble & 4) diff += step;

            predictor += (nibble & 8) ? -diff : diff;
            predictor = Math.max(-32768, Math.min(32767, predictor));
            stepIndex += IMA_INDEX_TABLE[nibble];
            stepIndex = Math.max(0, Math.min(88, stepIndex));

            output[outIndex++] = predictor / 32768;
            if (outIndex >= sampleCount) {
              break;
            }
          }
        }

        return output;
      }

      function playAudioChunk(message) {
        if (!audioState.enabled || !audioState.ctx || !message.payload) {
          return;
        }

        const currentDeviceId = deviceIdInput.value || "rc-car-01";
        if (message.deviceId && message.deviceId !== currentDeviceId) {
          return;
        }

        const seq = Number(message.seq || 0);
        const lastSeq = audioState.lastSeqByDevice.get(message.deviceId || currentDeviceId);
        if (Number.isFinite(lastSeq) && seq > lastSeq + 1) {
          log(`audio gap: ${seq - lastSeq - 1} chunk(s) dropped`);
        }
        audioState.lastSeqByDevice.set(message.deviceId || currentDeviceId, seq);

        const bytes = decodeBase64ToBytes(message.payload);
        const sampleRate = Number(message.sampleRate || 8000);
        const ctx = audioState.ctx;
        let samples;
        if (message.codec === "adpcm_ima") {
          samples = decodeAdpcmChunk(bytes, Number(message.samples || 0));
        } else {
          samples = new Float32Array(bytes.length);
          for (let i = 0; i < bytes.length; i += 1) {
            samples[i] = decodeMulawByte(bytes[i]);
          }
        }

        if (!samples.length) {
          return;
        }

        const buffer = ctx.createBuffer(1, samples.length, sampleRate);
        const channel = buffer.getChannelData(0);
        channel.set(samples);

        const now = ctx.currentTime;
        if (!audioState.nextPlayAt || audioState.nextPlayAt < now - 0.04) {
          audioState.nextPlayAt = now + audioState.targetLeadSeconds;
        }

        const queuedAhead = audioState.nextPlayAt - now;
        if (queuedAhead > audioState.maxLeadSeconds) {
          audioState.nextPlayAt = now + audioState.targetLeadSeconds;
          setAudioStatus(`audio resync ${queuedAhead.toFixed(3)}s`);
          return;
        }

        const source = ctx.createBufferSource();
        source.buffer = buffer;
        source.connect(ctx.destination);
        source.start(audioState.nextPlayAt);
        audioState.nextPlayAt += buffer.duration;
        setAudioStatus(`audio live ${queuedAhead.toFixed(3)}s queued`);
      }

      document.getElementById("connectBtn").addEventListener("click", () => {
        ws = new WebSocket(brokerInput.value);
        ws.onopen = () => {
          log("client socket connected");
          startClientPing();
        };
        ws.onclose = () => {
          stopClientPing();
          log("client socket closed");
        };
        ws.onerror = () => log("client socket error");
        ws.onmessage = (event) => {
          try {
            const message = JSON.parse(event.data);
            if (message.type !== "audio") {
              log(`recv ${event.data}`);
            }
            if (message.type === "status" && message.localIp && message.cameraReady) {
              const candidate = `http://${message.localIp}${message.streamPath || "/stream"}`;
              if (!videoUrlInput.value) {
                videoUrlInput.value = candidate;
              }
            }
            if (message.type === "status" && message.remoteVideoUrl) {
              const remoteCandidate = `${location.protocol}//${location.host}${message.remoteVideoUrl}`;
              if (!videoUrlInput.value || videoUrlInput.value.includes("/stream")) {
                videoUrlInput.value = remoteCandidate;
              }
            }
            if (message.type === "audio") {
              if (audioState.enabled && message.sampleRate && audioState.sampleRate !== Number(message.sampleRate)) {
                ensureAudioContext(Number(message.sampleRate)).catch(() => {});
              }
              playAudioChunk(message);
            }
          } catch {}
        };
      });

      document.getElementById("disconnectBtn").addEventListener("click", () => {
        if (ws) {
          stopClientPing();
          ws.close();
        }
      });

      document.getElementById("sendBtn").addEventListener("click", () => {
        send({
          type: "ctrl",
          deviceId: deviceIdInput.value || undefined,
          throttle: Number(throttleInput.value),
          steering: Number(steeringInput.value)
        });
      });

      document.getElementById("stopBtn").addEventListener("click", () => {
        throttleInput.value = "0";
        steeringInput.value = "0";
        send({
          type: "ctrl",
          deviceId: deviceIdInput.value || undefined,
          throttle: 0,
          steering: 0
        });
      });

      document.getElementById("loadVideoBtn").addEventListener("click", () => {
        loadVideo(videoUrlInput.value);
      });

      document.getElementById("clearVideoBtn").addEventListener("click", () => {
        videoFrame.removeAttribute("src");
        log("video cleared");
      });

      document.getElementById("startAudioBtn").addEventListener("click", async () => {
        try {
          await ensureAudioContext(audioState.sampleRate);
          audioState.enabled = true;
          audioState.nextPlayAt = 0;
          setAudioStatus("audio armed");
          log("audio enabled");
        } catch (error) {
          setAudioStatus("audio error");
          log(`audio init failed: ${error.message}`);
        }
      });

      document.getElementById("stopAudioBtn").addEventListener("click", async () => {
        audioState.enabled = false;
        audioState.nextPlayAt = 0;
        if (audioState.ctx && audioState.ctx.state === "running") {
          await audioState.ctx.suspend();
        }
        setAudioStatus("audio stopped");
        log("audio disabled");
      });
    </script>
  </body>
</html>
